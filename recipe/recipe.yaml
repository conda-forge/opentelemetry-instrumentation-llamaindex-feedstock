schema_version: 1

context:
  name: opentelemetry-instrumentation-llamaindex
  version: "0.62.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_llamaindex-${{ version }}.tar.gz
  sha256: 54ca08d6558d6b7638dd850809634c48927913973e6786a0a97494c2f298d0e6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.63b1
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
    - inflection >=0.5.1,<0.6.0
  run_constraints:
    - llama-index >=0.12.6,<0.13.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - llama-index
        - greenlet
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.llamaindex"
      - pip check

about:
  summary: OpenTelemetry LlamaIndex instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
